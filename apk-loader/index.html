<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Aurora</title>
  <style>
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a; color: #f5f5f5;
      min-height: 100dvh; display: grid; place-items: center;
      padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
      -webkit-font-smoothing: antialiased;
    }
    .box { width: 100%; max-width: 340px; text-align: center; }
    .logo {
      width: 96px; height: 96px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 22px; background: #161616; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 16px 40px -12px rgba(0,0,0,.8);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .logo img { width: 100%; height: 100%; display: block; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .status { margin-top: 14px; font-size: 13.5px; color: #9d9d9d; min-height: 20px; line-height: 1.5; }
    .status.err { color: #ef8b8b; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 7px;
      border: 2px solid rgba(255,255,255,.15); border-top-color: #f5f5f5; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .form {
      max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
      transition: max-height .35s cubic-bezier(.22,1,.36,1), opacity .3s ease, margin-top .35s ease;
    }
    .form.open { max-height: 300px; opacity: 1; margin-top: 26px; }
    .card {
      background: #141414; border: 1px solid #262626; border-radius: 14px;
      padding: 18px; text-align: left;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: #9d9d9d; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 15px; color: #f5f5f5;
      background: transparent; border: 1px solid #2c2c2c; border-radius: 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #f5f5f5; box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
    input::placeholder { color: #5a5a5a; }
    button {
      width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; font-weight: 600;
      color: #0a0a0a; background: #f5f5f5; border: 0; border-radius: 10px; cursor: pointer;
      transition: transform .12s cubic-bezier(.34,1.4,.64,1), opacity .15s;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .5; }
    .hint { margin-top: 16px; font-size: 12px; color: #6a6a6a; line-height: 1.6; }
    .hint code { background: #1c1c1c; padding: 1px 5px; border-radius: 5px; font-size: 11px; }
    .page-in { animation: pageIn .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }

    /* Panel frame — fills the whole screen once connected. */
    #shell {
      display: none; position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      background: #0a0a0a;
    }
    #shell.on { display: block; }
    #panel { width: 100%; height: 100%; border: 0; }

    /* Toast — tıklanabilir (aksiyon) veya sade bilgi */
    #toast {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      z-index: 9999; max-width: min(92vw, 460px);
      background: #161616cc; color: #67e8a3; border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 9px 14px; font-size: 13px;
      line-height: 1.45; text-align: center; backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none; transition: opacity .25s;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    #toast.on { opacity: 1; }
    #toast.err { color: #ff9e9e; border-color: #5a1f1f; }
    #toast.warn { color: #ffd28a; border-color: #5a451f; }
    #toast.actionable { pointer-events: auto; cursor: pointer; }

  </style>
  <script src="native-bridge.js"></script>
  <script src="capacitor-exports.js"></script>
  <script>
    if (typeof capacitorExports === 'function') {
      var _core = capacitorExports({});
      window.Capacitor = _core.Capacitor;
    }
  </script>
</head>
<body>
  <div class="box page-in" id="splash">
    <div class="logo"><img src="aurora.svg" alt="" /></div>
    <h1>Aurora</h1>
    <div class="status" id="status"><span class="spinner"></span>Connecting…</div>

    <div class="form" id="form">
      <div class="card">
        <label for="addr">Server address</label>
        <input id="addr" type="url" inputmode="url" autocomplete="off"
               spellcheck="false" placeholder="http://192.168.1.200:8788" />
        <button id="go">Connect</button>
        <p class="hint">
          Copy the URL printed when the server starts in Termux on J7 Prime.<br/>
          <code>bash ~/dashboard/start.sh</code>
        </p>
      </div>
    </div>
  </div>

  <div id="shell">
    <div id="toast" class="toast"></div>
    <iframe id="panel" title="Panel"></iframe>
  </div>

  <script>
    var $splash = document.getElementById('splash');
    var $input = document.getElementById('addr');
    var $btn = document.getElementById('go');
    var $status = document.getElementById('status');
    var $form = document.getElementById('form');
    var $shell = document.getElementById('shell');
    var $panel = document.getElementById('panel');
    var $toast = document.getElementById('toast');
    var KEY = 'serverUrl';
    var DEFAULT = 'http://192.168.1.200:8788';

    var IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    var AS = (IS_NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.AuroraStorage) || null;
    var AN = (IS_NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.AuroraNotification) || null;

    /* Toast helpers */
    var flashTimer = null;
    var flashAction = null;
    function flash(msg, kind, action) {
      if (!$toast) return;
      flashAction = action || null;
      $toast.textContent = msg;
      $toast.className = 'toast' + (kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : '') + (flashAction ? ' actionable' : '');
      $toast.classList.add('on');
      if (flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(function () { $toast.classList.remove('on'); flashAction = null; }, flashAction ? 12000 : 6000);
    }
    $toast.addEventListener('click', function () {
      if (flashAction) { var fn = flashAction; flashAction = null; $toast.classList.remove('on'); try { fn(); } catch (e) {} }
    });

    /* Connection flow */
    function setStatus(msg, isErr, busy) {
      $status.className = 'status' + (isErr ? ' err' : '');
      $status.innerHTML = (busy ? '<span class="spinner"></span>' : '') + msg;
    }
    function showForm() {
      $form.classList.add('open');
      setTimeout(function () { $input.focus(); }, 380);
    }
    function normalize(raw) {
      var v = raw.trim();
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      try { return new URL(v).origin; } catch (e) { return null; }
    }
    function connect(origin, remember) {
      setStatus('Connecting…', false, true);
      $btn.disabled = true;
      /* AbortController Chrome 66+ — J7 Prime'daki WebView 64'te yok.
         Manuel timeout yarışı kullan. Asılı fetch'te buton ölmesin. */
      var timedOut = false;
      var timer = setTimeout(function () {
        timedOut = true;
        $btn.disabled = false;
        setStatus('Can\'t reach the server — timed out', true);
        showForm();
      }, 4000);
      fetch(origin + '/api/ping', { cache: 'no-store' })
        .then(function (r) { return r.ok && !timedOut ? r.json() : Promise.reject(); })
        .then(function (data) {
          clearTimeout(timer);
          if (!data || data.ok !== true) return Promise.reject();
          if (remember) try { localStorage.setItem(KEY, origin); } catch (e) {}
          setStatus('Connected ✓');
          setTimeout(function () { enterShell(origin); }, 250);
        })
        .catch(function () {
          clearTimeout(timer);
          $btn.disabled = false;
          setStatus('Can\'t reach the server — is J7 on and on the same Wi-Fi?', true);
          showForm();
        });
    }

    $btn.addEventListener('click', function () {
      var origin = normalize($input.value);
      if (!origin) { setStatus('Enter a valid address (e.g. 192.168.1.200:8788)', true); return; }
      connect(origin, true);
    });
    $input.addEventListener('keydown', function (e) { if (e.key === 'Enter') $btn.click(); });

    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) {
      $input.value = saved;
      connect(saved, false);
    } else {
      $input.value = DEFAULT;
      setStatus('Enter the server address');
      showForm();
    }

    /* Notification / widget pipeline — APK shell (parent frame) */
    var $currentOrigin = null;
    function trustedOrigin() {
      if ($currentOrigin) return $currentOrigin;
      try {
        var saved = localStorage.getItem(KEY);
        if (saved) $currentOrigin = new URL(saved).origin;
      } catch (e) {}
      return $currentOrigin;
    }
    function readCachedState() {
      try { return JSON.parse(localStorage.getItem('lastState') || '{}'); } catch (e) { return {}; }
    }

    /* İzin durumu — dialog açıkken de doğru cevap için önbellek + tek dialog */
    var permInFlight = null;
    async function ensurePerm() {
      if (permInFlight) return permInFlight;
      permInFlight = (async function () {
        if (!IS_NATIVE) return false;
        var permGranted = null;
        try {
          // status: { granted } — diyalog AÇMADAN bakar
          var st = await window.Capacitor.nativePromise('AuroraNotification', 'permissionStatus', {});
          permGranted = !!(st && st.granted);
          if (!permGranted) {
            // Dialog açılır; promise kullanıcı cevaplayınca resolve olur.
            var r = await window.Capacitor.nativePromise('AuroraNotification', 'requestPermission', {});
            permGranted = !!(r && r.granted);
          }
        } catch (e) {
          /* permissionStatus eski APK'da yok → UNIMPLEMENTED. Ölümcül değil:
             bilinmiyor say ve devam et; gerçek hata schedule'da görünür. */
          permGranted = null;
        }
        if (permGranted === false) {
          flash('🔕 Bildirim izni yok — buraya dokunup ayarlardan aç', 'warn', function () {
            try { window.Capacitor.nativePromise('AuroraNotification', 'openSettings', {}); } catch (e2) {}
          });
        }
        return permGranted !== false;
      })();
      try { return await permInFlight; } finally { permInFlight = null; }
    }

    /* Uygulama ilk açıldığında sistem izin diyaloğunu bir kez göster. */
    function firstLaunchPermissionAsk() {
      if (!IS_NATIVE) return;
      ensurePerm();
    }

    /* İzin/alarm ortamı kontrolü — dokunulabilir uyarılar */
    function checkExactAlarmAndBattery() {
      if (!IS_NATIVE) return;
      window.Capacitor.nativePromise('AuroraNotification', 'diagnostics', {})
        .then(function (d) {
          if (!d) return;
          if (d.notificationsEnabled === false) {
            flash('🔕 Bildirim izni yok — dokun ve ayarlardan aç', 'warn', function () {
              try { window.Capacitor.nativePromise('AuroraNotification', 'openSettings', {}); } catch (e) {}
            });
          } else if (d.channelBlocked) {
            flash('🔕 "Aurora reminders" kanalı kapalı — bildirim ayarlarından aç', 'warn', function () {
              try { window.Capacitor.nativePromise('AuroraNotification', 'openSettings', {}); } catch (e) {}
            });
          }
          if (d.exactAlarms === false) {
            flash('⏰ Tam zamanlı alarm izni kapalı — dokun ve aç', 'warn', function () {
              try { window.Capacitor.nativePromise('AuroraStorage', 'openExactAlarmSettings', {}); } catch (e) {}
            });
          }
          if (d.batteryOptimized === true) {
            flash('🔋 Pil optimizasyonu alarmları erteliyor — dokun ve muafiyet ver', 'warn', function () {
              try { window.Capacitor.nativePromise('AuroraStorage', 'openBatterySettings', {}); } catch (e) {}
            });
          }
        })
        .catch(function () {});
    }

    async function applyPendingRoute() {
      if (!AS || !AS.get) return;
      try {
        var r = await window.Capacitor.nativePromise('AuroraStorage', 'get', { key: 'pending-route' });
        var route = r && r.value;
        if (route && $shell.classList.contains('on')) {
          $panel.src = trustedOrigin() + '/#' + route;
          await window.Capacitor.nativePromise('AuroraStorage', 'remove', { key: 'pending-route' });
        }
      } catch (e) {}
    }

    async function syncNative(state) {
      if (!AN) return;
      const ok = await ensurePerm();
      if (!ok) return;
      try {
        const drafts = buildNativeDrafts(state);
        await window.Capacitor.nativePromise('AuroraNotification', 'cancelAll', {});
        if (drafts.length) await window.Capacitor.nativePromise('AuroraNotification', 'schedule', { notifications: drafts });
        /* Sessiz senkron — her güncellemede toast spam'i rahatsız ediyordu */
      } catch (e) {
        flash('✗ Hatırlatıcı kurulamadı: ' + (e && e.message ? e.message : ''), 'err');
      }
    }

    /* Hatırlatıcı taslakları — TS buildDrafts ile aynı mantık, sadece tarih
       hesabı lokal. (Iframe postMessage payload'ı zaten buraya gelir.) */
    function buildNativeDrafts(s) {
      if (!s) s = {};
      if (s.remindersEnabled === false) return [];
      var drafts = [];
      var today = todayISO();
      var remTime = s.reminderTime || '18:00';
      var todoDays = s.todoReminderDays || 2;
      var examDays = s.examReminderDays || 7;
      var leadMin = Math.max(5, Math.min(180, s.examLeadMinutes || 30));
      var notif = s.notifications || {};

      // 1) Su — günlük
      if (s.waterEnabled !== false) {
        var fromH = parseInt((s.waterFrom || '08:00').split(':')[0], 10) || 8;
        var toH = parseInt((s.waterTo || '22:00').split(':')[0], 10) || 22;
        var step = Math.max(1, Math.min(6, s.waterEveryHours || 2));
        for (var h = fromH; h <= toH; h += step) {
          drafts.push({ id: hashId('w', '' + h), title: '💧 Su içme zamanı', body: 'Bir bardak su iç — beyninin de buna ihtiyacı var.', route: '/fitness', everyDay: { hour: h, minute: 0 } });
        }
      }

      // 2) Antrenman — bugün yapılmadıysa
      if (s.workoutEnabled !== false) {
        var doneToday = (s.workouts && s.workouts[today] && s.workouts[today].length > 0);
        if (!doneToday) {
          drafts.push({ id: hashId('wo', 'today'), title: '🏋️ Antrenman zamanı', body: "Bugünkü antrenman hâlâ bekliyor. 30 dakika yeter, hadi başla!", route: '/fitness', at: nextOccurrence(s.workoutTime || '17:30').toISOString() });
        }
      }

      // 3) Todo — sınavdan/görevden X gün önce
      if (notif.todoChannel !== false) {
        var todos = (s.todos || []).filter(function (x) { return !x.done && x.due && daysUntil(x.due) >= todoDays; })
          .sort(function (a, b) { return (a.due || '').localeCompare(b.due || ''); }).slice(0, 32);
        todos.forEach(function (todo) {
          var fireDate = plusDaysISO(daysUntil(todo.due) - todoDays);
          drafts.push({ id: hashId('t', todo.id), title: '⏳ Ödev hatırlatıcı', body: '«' + todo.title + '» — ' + todoDays + ' gün kaldı. Bugün başla.', route: '/todos', at: atTimeISO(fireDate, remTime) });
        });
      }

      // 4) Sınav
      if (notif.examChannel !== false) {
        var exams = (s.exams || []).filter(function (e) { return daysUntil(e.date) >= examDays; })
          .sort(function (a, b) { return a.date.localeCompare(b.date); }).slice(0, 32);
        exams.forEach(function (ex) {
          var fireDate = plusDaysISO(daysUntil(ex.date) - examDays);
          drafts.push({ id: hashId('e', ex.id), title: '📝 Sınav hatırlatıcı', body: '«' + ex.title + '» sınavı ' + ex.date + ' — ' + examDays + ' gün kaldı.', route: '/student', at: atTimeISO(fireDate, remTime) });
        });
        var todayExams = (s.exams || []).filter(function (e) { return e.date === today && e.time; });
        todayExams.forEach(function (ex) {
          var examAt = new Date(atTimeISO(ex.date, ex.time));
          var at = new Date(examAt.getTime() - leadMin * 60000);
          if (at.getTime() <= Date.now()) return;
          drafts.push({ id: hashId('e30', ex.id), title: '⏰ Sınav yaklaşıyor', body: '«' + ex.title + '» ' + leadMin + ' dakika sonra (' + ex.time + ').', route: '/student', at: at.toISOString() });
        });
      }

      // 5) Habit
      (s.habits || []).forEach(function (h) {
        if (h.archived || !h.reminderTime) return;
        var p = h.reminderTime.split(':');
        drafts.push({ id: hashId('hb', h.id), title: h.type === 'quit' ? '🚭 Devam, güçlü ol' : ('🔁 ' + h.title), body: h.type === 'quit' ? 'Harika gidiyorsun!' : 'Alışkanlığını kontrol etme zamanı.', route: '/habits', everyDay: { hour: +p[0] || 9, minute: +p[1] || 0 } });
      });

      return drafts;
    }

    function todayISO() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function plusDaysISO(n) {
      var d = new Date();
      d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function atTimeISO(dateISO, hhmm) {
      var p = hhmm.split(':');
      return dateISO + 'T' + String(+p[0]).padStart(2, '0') + ':' + String(+p[1]).padStart(2, '0') + ':00';
    }
    function daysUntil(iso) {
      var a = new Date(iso + 'T00:00:00');
      var b = new Date();
      b.setHours(0, 0, 0, 0);
      return Math.round((a - b) / 86400000);
    }
    function nextOccurrence(hhmm) {
      var p = hhmm.split(':');
      var c = new Date();
      c.setHours(+p[0], +p[1], 0, 0);
      if (c.getTime() <= Date.now()) c.setDate(c.getDate() + 1);
      return c;
    }
    /* TS tarafıyla bire bir aynı: ((h * 31) + char) >>> 0; pozitif int. */
    function hashId(prefix, raw) {
      var h = 0 >>> 0;
      var s = prefix + raw;
      for (var i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
      if (h === 0) h = 1;
      return h % 2000000000;
    }

    /* Sunucu bataryası — düşükse uyar */
    var batteryLast = 0;
    async function checkServerBattery(origin) {
      if (!AN) return;
      try {
        var r = await fetch(origin + '/api/battery', { cache: 'no-store' });
        if (!r.ok) return;
        var b = await r.json();
        if (b.percent == null) return;
        if (!(b.percent <= 25 && !b.charging)) { try { localStorage.removeItem('batteryAlertAt'); } catch (e) {} return; }
        var last = Number(localStorage.getItem('batteryAlertAt') || 0);
        if (Date.now() - last < 3600000) return;
        localStorage.setItem('batteryAlertAt', String(Date.now()));
        try {
          await window.Capacitor.nativePromise('AuroraNotification', 'schedule', { notifications: [{ id: 'server-battery', title: '🔋 Sunucu bataryası az', body: 'J7 Prime bataryası %' + b.percent + ' — şarja tak.', route: '/server', at: new Date(Date.now() + 500).toISOString() }] });
        } catch (e) {}
      } catch (e) {}
    }

    /* postMessage — iframe'den panelden gelen state/widget verisi */
    window.addEventListener('message', async function (e) {
      if (!e.data) return;
      var origin = trustedOrigin();
      if (origin && e.origin !== origin) return;
      if (e.data.type === 'aurora-state') {
        scheduleSync(e.data.payload);
      } else if (e.data.type === 'aurora-perm-result') {
        /* noop: panel kendi dinliyor */
      } else if (e.data.type === 'aurora-notif-permission') {
        /* Iframe (panel) izin durumunu soruyor → native diyaloğu parent açar,
           sonucu panel'e geri gönderir (Settings "Try again" gerçek sonucu alır) */
        var granted = await ensurePerm();
        try { $panel.contentWindow.postMessage({ type: 'aurora-perm-result', granted: granted }, trustedOrigin()); } catch (err) {}
      } else if (e.data.type === 'aurora-widget-data') {
        if (AS) {
          try {
            await window.Capacitor.nativePromise('AuroraStorage', 'set', { key: 'widget-data', value: JSON.stringify(e.data.payload) });
            await window.Capacitor.nativePromise('AuroraStorage', 'notifyWidgets', {});
          } catch (err) { console.warn('widget write failed', err); }
        }
      } else if (e.data.type === 'aurora-notif-test') {
        if (!AN) { flash('Bu özellik sadece APK\'da çalışır', 'warn'); return; }
        var ok = await ensurePerm();
        if (!ok) return;
        try {
          await AN.sendTest({ title: '🔔 Aurora test', body: 'Bildirimler çalışıyor — hatırlatıcılar bu şekilde gelecek.', route: '/' });
          flash('✓ Test bildirimi gönderildi — 1-2 sn içinde gelecek');
        } catch (err) {
          flash('✗ Test gönderilemedi: ' + (err && err.message ? err.message : ''), 'err');
        }
      }
    });

    /* Panel hazır bayrağı: iframe load olmadan postMessage kuyruğu sessizce
       kaybolur (about:blank'a gider). Drain ancak panel hazırken çalışsın. */
    var panelReady = false;
    var syncTimer = null;
    /* Her state değişiminde cancelAll+schedule fırtınası alarmları tam
       tetiklenecek sırada iptal edebiliyordu — trailing debounce ile sakinleştir */
    function scheduleSync(state) {
      try { localStorage.setItem('lastState', JSON.stringify(state)); } catch (e) {}
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(function () { syncTimer = null; syncNative(state); }, 1500);
    }

    /* Widget dokunuş kuyruğu → panel DB. Kuyruk boşken işlemsiz (native çağrı
       ucuz); doluysa panelin postMessage kanalına aktarılır. */
    async function drainHabitQueue() {
      if (!IS_NATIVE || !panelReady || !$shell.classList.contains('on')) return;
      try {
        var r = await window.Capacitor.nativePromise('AuroraStorage', 'drainHabitQueue', {});
        var items = r && r.items;
        if (!items || !items.length) return;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          try {
            $panel.contentWindow.postMessage({
              type: 'aurora-widget-toggle-habit',
              habitId: it.habitId,
              iso: it.iso,
            }, trustedOrigin());
          } catch (e) {}
        }
      } catch (e) { /* eski APK'da metot yok — sessiz */ }
    }

    function enterShell(origin) {
      $currentOrigin = origin;
      $splash.style.display = 'none';
      $shell.classList.add('on');
      panelReady = false;
      $panel.src = origin;
      if (IS_NATIVE) {
        firstLaunchPermissionAsk();
        setTimeout(applyPendingRoute, 600);
        setTimeout(function () { syncNative(readCachedState()); }, 1200);
        setInterval(function () { checkServerBattery(origin); }, 60000);
        checkServerBattery(origin);
        // Widget dokunuş kuyruğu: home-screen widget'ına dokunulduğunda native
        // kuyruğa yazılır; panel hazırken 5 sn'de bir boşaltılıp DB'ye işletilir.
        setInterval(drainHabitQueue, 5000);
        $panel.addEventListener('load', function () { panelReady = true; drainHabitQueue(); });
        // Uygulama öne gelince yeniden planla (deep-link geldikten sonra da)
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible') return;
          applyPendingRoute();
          if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
          syncNative(readCachedState());
          drainHabitQueue();
        });
      }
    }
  </script>
</body>
</html>
